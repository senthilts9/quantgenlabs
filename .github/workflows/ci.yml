name: ci
on:
  push: { branches: [main, "feat/**"] }
  pull_request: { branches: [main] }
jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engines + run C++ tests (compile clean, cross-check, determinism)
        run: |
          set -e
          for b in quant_bench parallel_bench lsm_bench; do
            g++ -std=c++20 -O3 -Wall -Wextra -pthread -Icpp/include cpp/src/$b.cpp -o /tmp/$b && /tmp/$b
          done
          g++ -std=c++20 -O3 -Wall -Wextra -Icpp/include cpp/src/crypto_sim.cpp -o /tmp/crypto_sim && /tmp/crypto_sim
          # Benchmark harness: built and smoke-run on a tiny workload so it cannot
          # rot. CI runners are shared and throttled, so the NUMBERS from CI are
          # not published anywhere -- only that the harness still runs and emits
          # valid JSON.
          # The lifecycle demo is a build+run target too: it exercises the whole
          # connectivity path, so if it stops working the composition is broken even
          # if every unit test still passes.
          g++ -std=c++20 -O2 -Wall -Wextra -pthread -Icpp/include cpp/src/lifecycle_demo.cpp -o /tmp/lifecycle_demo && /tmp/lifecycle_demo > /dev/null
          # Latency harness: built and smoke-run. Like the throughput harness, its
          # NUMBERS from CI are not published -- shared runners are throttled and a
          # tail figure from one is meaningless.
          g++ -std=c++20 -O3 -Wall -Wextra -pthread -Icpp/include cpp/src/lat_bench.cpp -o /tmp/lat_bench
          /tmp/lat_bench 5000 > /tmp/lat.json
          python3 -c "
          import json; d = json.load(open('/tmp/lat.json'))
          assert d['kind'] == 'latency_distribution'
          # Both clocks are characterised now: adding RDTSC split the old single
          # clock_overhead_ns into two, and nested them under 'timer'. CI kept
          # asserting the old top-level key and failed on every commit.
          t = d['timer']
          assert t['clock_gettime_overhead_ns']['p50'] >= 0
          assert t['tsc_overhead_ns']['p50'] >= 0
          # The reason RDTSC was added at all. If this ever fails, the cheap
          # timer is not cheap and the sub-100ns measurements are timer noise.
          assert t['tsc_overhead_ns']['p50'] <= t['clock_gettime_overhead_ns']['p50'], \
              'RDTSC is not cheaper than clock_gettime -- the measurements below ' \
              'the clock floor cannot be trusted'
          print('latency JSON valid; tsc p50=%s vs clock_gettime p50=%s'
                % (t['tsc_overhead_ns']['p50'], t['clock_gettime_overhead_ns']['p50']))
          "
          g++ -std=c++20 -O3 -Wall -Wextra -pthread -Icpp/include cpp/src/mkt_bench.cpp -o /tmp/mkt_bench
          /tmp/mkt_bench 200000 1 > /tmp/bench.json
          python3 -c "import json;d=json.load(open('/tmp/bench.json'));assert d['schema_version']==1;assert d['monte_carlo']['timesteps_per_path']==1;print('bench JSON valid')"
          for t in test_engines test_book test_feed test_fix test_fix_session test_pretrade test_matching test_fix_venue test_desk test_lat test_hft; do
            g++ -std=c++20 -O2 -Wall -Wextra -pthread -Icpp/include -Icpp/tests cpp/tests/$t.cpp -o /tmp/$t && /tmp/$t
          done
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Install from requirements.txt rather than a hand-written list. The list
      # was a subset of the 22 packages the app actually declares and had drifted
      # from it: pandas and matplotlib were both missing, so two steps failed on
      # ModuleNotFoundError for dependencies the repo has declared all along.
      # Installing the real file makes that class of failure impossible, and has
      # the side benefit that the lakehouse and event-bus suites run here instead
      # of skipping on absent imports. pgserver ships real PostgreSQL binaries as
      # a wheel, so the repository tests run against an actual server with no
      # service container to provision.
      - run: pip install -r backend/requirements.txt
      # Test-only, deliberately not in requirements.txt: these ship with the
      # tests, not with the app.
      - run: pip install pytest hypothesis pybind11 httpx
      - name: Build pybind11 extensions (C++/Python parity tests need them)
        run: ./scripts/build_bindings.sh
      - name: Property tests (pytest + Hypothesis)
        run: cd backend && PYTHONPATH=. pytest tests -q
      - name: Offline property runner (no test deps)
        run: python backend/tests/run_local.py
      - name: Engine math verifiers
        run: |
          python backend/verify/verify_core.py
          python backend/verify/verify_crypto.py
          python backend/verify/verify_sor.py
          python backend/run_sor.py
      - name: Basis backtest (smoke, produces tearsheet)
        run: python backend/run_backtest.py --days 180
      - name: Syntax-check backend
        run: python -m py_compile backend/app/main.py backend/app/core/engines.py backend/app/services/tick_loop.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm install && npm run build

  frontend-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm --prefix frontend ci || npm --prefix frontend install
      - name: Unit tests (sorting, CSV escaping, fuzzy matching)
        run: npm --prefix frontend test

  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          set -e
          pip install pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for f in sorted(pathlib.Path("deploy/k8s").glob("*.yaml")):
              for d in yaml.safe_load_all(f.read_text()):
                  if not d:
                      continue
                  if "kind" not in d or "apiVersion" not in d:
                      print(f"{f}: document missing kind/apiVersion"); bad += 1
          # The example secret must never carry a real-looking value.
          txt = pathlib.Path("deploy/k8s/secrets.example.yaml").read_text()
          if "sk-ant-" in txt.split("#")[0] or "REPLACE-ME" not in txt:
              print("secrets.example.yaml looks like it holds real values"); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: Validate Grafana dashboards and Prometheus config
        run: |
          set -e
          pip install pyyaml
          python - <<'PY'
          import json, pathlib, re, sys, yaml
          bad = 0
          # Every panel query must reference a metric the code actually declares.
          src = pathlib.Path("backend/app/obs/trading_metrics.py").read_text()
          declared = set(re.findall(r'"(qgl_[a-z_0-9]+)"', src))
          for f in pathlib.Path("observability/grafana/dashboards").glob("*.json"):
              d = json.loads(f.read_text())
              ids = [p["id"] for p in d["panels"]]
              if len(ids) != len(set(ids)):
                  print(f"{f.name}: duplicate panel ids"); bad += 1
              for p in d["panels"]:
                  for t in p.get("targets", []):
                      for m in re.findall(r"qgl_[a-z_0-9]+", t["expr"]):
                          base = re.sub(r"_(bucket|count|sum)$", "", m)
                          if not (m in declared or base in declared
                                  or f"{base}_total" in declared):
                              print(f"{f.name} panel {p['id']}: {m} is not declared")
                              bad += 1
              print(f"{f.name}: {len(d['panels'])} panels ok")
          yaml.safe_load(pathlib.Path("observability/prometheus.yml").read_text())
          yaml.safe_load(pathlib.Path(
              "observability/grafana/provisioning/dashboards/provider.yml").read_text())
          sys.exit(1 if bad else 0)
          PY

      - name: Validate docker-compose
        run: |
          # compose declares `env_file: .env`, and .env is gitignored because it
          # holds a live ANTHROPIC_API_KEY. Synthesise a throwaway from the
          # tracked example so validation exercises the real code path rather
          # than a special case -- which also checks that .env.example actually
          # covers every ${VAR:?} guard compose declares. The two passwords are
          # appended (later wins in a dotenv file) because the example ships
          # them empty on purpose, and `:?` rejects empty as well as unset.
          cp .env.example .env
          printf 'GRAFANA_ADMIN_PASSWORD=ci-validation-only\nPOSTGRES_PASSWORD=ci-validation-only\n' >> .env
          docker compose -f docker-compose.yml config --quiet
          rm -f .env
      - name: Build the API image
        run: docker build -f deploy/Dockerfile.api -t qgl-api:ci .
      - name: The connectivity extension must be in the image
        run: |
          docker run --rm qgl-api:ci python -c "
          import mkt_connectivity, quant_engine_cpp
          d = mkt_connectivity.SimulatedDesk(1, 50000, 0.01)
          d.start(0)
          assert d.connected(), 'FIX session failed to come up in the image'
          print('mkt_connectivity ok in image')
          "
      - name: Build the web image
        run: docker build -f deploy/Dockerfile.web -t qgl-web:ci .
