name: ci
on:
  push: { branches: [main, "feat/**"] }
  pull_request: { branches: [main] }
jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engines + run C++ tests (compile clean, cross-check, determinism)
        run: |
          set -e
          for b in quant_bench parallel_bench lsm_bench; do
            g++ -std=c++20 -O3 -Wall -Wextra -pthread -Icpp/include cpp/src/$b.cpp -o /tmp/$b && /tmp/$b
          done
          g++ -std=c++20 -O3 -Wall -Wextra -Icpp/include cpp/src/crypto_sim.cpp -o /tmp/crypto_sim && /tmp/crypto_sim
          # Benchmark harness: built and smoke-run on a tiny workload so it cannot
          # rot. CI runners are shared and throttled, so the NUMBERS from CI are
          # not published anywhere -- only that the harness still runs and emits
          # valid JSON.
          # The lifecycle demo is a build+run target too: it exercises the whole
          # connectivity path, so if it stops working the composition is broken even
          # if every unit test still passes.
          g++ -std=c++20 -O2 -Wall -Wextra -pthread -Icpp/include cpp/src/lifecycle_demo.cpp -o /tmp/lifecycle_demo && /tmp/lifecycle_demo > /dev/null
          # Latency harness: built and smoke-run. Like the throughput harness, its
          # NUMBERS from CI are not published -- shared runners are throttled and a
          # tail figure from one is meaningless.
          g++ -std=c++20 -O3 -Wall -Wextra -pthread -Icpp/include cpp/src/lat_bench.cpp -o /tmp/lat_bench
          /tmp/lat_bench 5000 > /tmp/lat.json
          python3 -c "import json;d=json.load(open('/tmp/lat.json'));assert d['kind']=='latency_distribution';assert d['clock_overhead_ns']['p50']>=0;print('latency JSON valid')"
          g++ -std=c++20 -O3 -Wall -Wextra -pthread -Icpp/include cpp/src/mkt_bench.cpp -o /tmp/mkt_bench
          /tmp/mkt_bench 200000 1 > /tmp/bench.json
          python3 -c "import json;d=json.load(open('/tmp/bench.json'));assert d['schema_version']==1;assert d['monte_carlo']['timesteps_per_path']==1;print('bench JSON valid')"
          for t in test_engines test_book test_feed test_fix test_fix_session test_pretrade test_matching test_fix_venue test_desk test_lat; do
            g++ -std=c++20 -O2 -Wall -Wextra -pthread -Icpp/include -Icpp/tests cpp/tests/$t.cpp -o /tmp/$t && /tmp/$t
          done
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy fastapi pydantic prometheus-client pytest hypothesis pybind11 httpx
      # The relational, auth and tracing suites. pgserver ships real PostgreSQL
      # binaries as a wheel, so the repository tests run against an actual server
      # in CI with no service container to provision.
      - run: pip install "sqlalchemy>=2.0" alembic "psycopg[binary]" pgserver pyjwt opentelemetry-sdk opentelemetry-instrumentation-fastapi
      - name: Build pybind11 extensions (C++/Python parity tests need them)
        run: ./scripts/build_bindings.sh
      - name: Property tests (pytest + Hypothesis)
        run: cd backend && PYTHONPATH=. pytest tests -q
      - name: Offline property runner (no test deps)
        run: python backend/tests/run_local.py
      - name: Engine math verifiers
        run: |
          python backend/verify/verify_core.py
          python backend/verify/verify_crypto.py
          python backend/verify/verify_sor.py
          python backend/run_sor.py
      - name: Basis backtest (smoke, produces tearsheet)
        run: python backend/run_backtest.py --days 180
      - name: Syntax-check backend
        run: python -m py_compile backend/app/main.py backend/app/core/engines.py backend/app/services/tick_loop.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm install && npm run build

  frontend-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm --prefix frontend ci || npm --prefix frontend install
      - name: Unit tests (sorting, CSV escaping, fuzzy matching)
        run: npm --prefix frontend test

  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Kubernetes manifests
        run: |
          set -e
          pip install pyyaml
          python - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for f in sorted(pathlib.Path("deploy/k8s").glob("*.yaml")):
              for d in yaml.safe_load_all(f.read_text()):
                  if not d:
                      continue
                  if "kind" not in d or "apiVersion" not in d:
                      print(f"{f}: document missing kind/apiVersion"); bad += 1
          # The example secret must never carry a real-looking value.
          txt = pathlib.Path("deploy/k8s/secrets.example.yaml").read_text()
          if "sk-ant-" in txt.split("#")[0] or "REPLACE-ME" not in txt:
              print("secrets.example.yaml looks like it holds real values"); bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: Validate docker-compose
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build the API image
        run: docker build -f deploy/Dockerfile.api -t qgl-api:ci .
      - name: The connectivity extension must be in the image
        run: |
          docker run --rm qgl-api:ci python -c "
          import mkt_connectivity, quant_engine_cpp
          d = mkt_connectivity.SimulatedDesk(1, 50000, 0.01)
          d.start(0)
          assert d.connected(), 'FIX session failed to come up in the image'
          print('mkt_connectivity ok in image')
          "
      - name: Build the web image
        run: docker build -f deploy/Dockerfile.web -t qgl-web:ci .
