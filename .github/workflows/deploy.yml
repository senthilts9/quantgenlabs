name: deploy

# Only after CI is green. workflow_run fires when the ci workflow COMPLETES, and
# the job below still checks its conclusion -- without that check this runs on a
# failed CI too, which is the whole point of gating on it.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would change without deploying"
        type: boolean
        default: false

# One deploy at a time. Two overlapping rsyncs into the same directory while a
# build reads from it produces a tree that is neither version.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Not configured is not a failure. Until the secrets are added this
      # workflow would red-X every single commit, and a check that is always red
      # is a check nobody reads -- including on the commit where it means
      # something. It reports "not configured" and succeeds; the deploy step
      # below is gated on this and simply does not run.
      - name: Check deploy credentials
        id: creds
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "${{ vars.DEPLOY_HOST_KEY }}" ] || [ -z "${{ vars.DEPLOY_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Automated deploy is not configured, so this run did nothing. Add DEPLOY_SSH_KEY (secret) and DEPLOY_HOST / DEPLOY_USER / DEPLOY_SITE / DEPLOY_HOST_KEY (variables) -- see docs/deploy-runbook.md. Until then deploy by running ./scripts/deploy.sh locally."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load the deploy key
        if: steps.creds.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # PIN the host key rather than StrictHostKeyChecking=no. Accepting any
          # key means a deploy would happily push the source and secrets of this
          # platform to whatever answers on that address.
          printf '%s\n' "${{ vars.DEPLOY_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "::error::DEPLOY_HOST_KEY variable not set -- refusing to deploy without a pinned host key"; exit 1; }

      - name: Deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: /home/runner/.ssh/deploy_key
          DEPLOY_SITE: ${{ vars.DEPLOY_SITE }}
        run: ./scripts/deploy.sh ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Shred the key
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
