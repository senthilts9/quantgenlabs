apiVersion: v1
kind: Namespace
metadata:
  name: quantgenlabs
  labels:
    app.kubernetes.io/name: quantgenlabs
---
# A quota so a runaway rollout cannot consume the cluster. Sized for the
# deployments in this directory with headroom for a rolling update.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: quantgenlabs-quota
  namespace: quantgenlabs
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "4"
