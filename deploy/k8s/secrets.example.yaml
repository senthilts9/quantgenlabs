# EXAMPLE ONLY -- do not apply this file and do not put real values in it.
#
# Committing a Secret manifest means committing its contents: base64 is encoding,
# not encryption, and `kubectl get secret -o yaml | base64 -d` is the whole
# attack. Create secrets imperatively or through a sealed-secrets/external-secrets
# operator.
#
#   kubectl -n quantgenlabs create secret generic qgl-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=postgres-password="$(openssl rand -base64 32)" \
#     --from-literal=users="trader1:CHANGEME:trader;risk1:CHANGEME:risk" \
#     --from-literal=anthropic-api-key="sk-ant-..."
apiVersion: v1
kind: Secret
metadata:
  name: qgl-secrets
  namespace: quantgenlabs
type: Opaque
stringData:
  jwt-secret: "REPLACE-ME-min-32-chars-the-app-refuses-shorter"
  postgres-password: "REPLACE-ME"
  users: "trader1:REPLACE-ME:trader;risk1:REPLACE-ME:risk;admin1:REPLACE-ME:admin"
  anthropic-api-key: ""
