apiVersion: apps/v1
kind: Deployment
metadata:
  name: qgl-web
  namespace: quantgenlabs
  labels: { app.kubernetes.io/name: qgl-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: qgl-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: qgl-web }
    spec:
      # NOT runAsNonRoot, and that is matched to the image rather than aspirational.
      # deploy/Dockerfile.web is nginx:alpine, which starts as root to bind :80
      # and drops to the nginx user for workers. Declaring runAsNonRoot here would
      # crash-loop the pod.
      #
      # The port is 80 for the same reason: the sibling Meridian stack proxies to
      # http://qgl-web:80/ over the shared docker network, and docker-compose maps
      # 5174:80. Moving to nginx-unprivileged on 8080 is the right hardening, but
      # it is a change to a LIVE deployment topology and belongs in its own commit
      # with the compose file and that proxy updated together -- not smuggled into
      # a manifest that has never been applied.
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/senthilts9/quantgenlabs-web:latest
          ports: [{ name: http, containerPort: 80 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # NET_BIND_SERVICE is what lets nginx bind :80 as a non-root worker;
            # dropping ALL without it fails to start.
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          volumeMounts:
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        # readOnlyRootFilesystem means nginx needs these writable explicitly.
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: qgl-web
  namespace: quantgenlabs
spec:
  selector: { app.kubernetes.io/name: qgl-web }
  ports:
    - { name: http, port: 80, targetPort: http }
