server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx defaults to gzip off, so the console was shipping its JS bundle
    # uncompressed: 301KB on the wire for something that gzips to well under a
    # third of that. On a link with any real latency that is seconds of dead
    # screen before React has even parsed, on every cold load.
    #
    # gzip_proxied any + the Vary header matter because this sits behind a
    # shared reverse proxy: without them nginx skips compression for proxied
    # requests, and a cache in front could serve a compressed body to a client
    # that never asked for one.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;          # below ~1KB the header costs more than it saves
    gzip_comp_level 6;             # past 6 the CPU climbs and the bytes barely move
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # The SPA calls /api/* relatively. In production the public entrypoint
    # (the shared reverse proxy) already routes /api to the api container,
    # but proxying here too keeps this image self-contained so hitting the
    # web container directly on :5174 works the same as the public URL.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # live CCXT fan-out across venues is slow

        # Payloads here are JSON in the tens-to-hundreds of KB (the board is
        # ~40 instruments with history). Compressing the proxied response is
        # the single cheapest win on a high-latency link.
        gzip on;
        gzip_types application/json;
    }

    # Vite emits content-hashed filenames (index-k_QBtc_3.js), so the content
    # at a given path can never change -- a new build is a new URL. Without an
    # explicit Cache-Control nginx falls back to ETag/Last-Modified, and the
    # browser spends a full round-trip revalidating a file it already has,
    # before it can render anything. immutable skips that entirely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html is NOT hashed and must never be cached: a stale one keeps
        # pointing at the previous build's asset URLs, which 404 after a deploy.
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
