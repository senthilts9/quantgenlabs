# Full stack: API + web + Prometheus + Grafana.
#   cp .env.example .env   # optionally set ANTHROPIC_API_KEY
#   docker compose up --build
services:
  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    env_file: .env
    environment:
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-haiku-4-5}"
      # Relational store. Commented out by default: with it unset the OMS keeps
      # using its SQLite book, so `docker compose up` works with no database to
      # provision. Uncomment together with the `postgres` service below.
      # QGL_DATABASE_URL: "postgresql://qgl:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/quantgenlabs"
      #
      # Auth enforcement is OFF unless explicitly enabled, because turning it on
      # without provisioning QGL_USERS locks every guarded endpoint with no way
      # in. Set both together or neither.
      QGL_REQUIRE_AUTH: "${QGL_REQUIRE_AUTH:-}"
      QGL_USERS: "${QGL_USERS:-}"
      QGL_JWT_SECRET: "${QGL_JWT_SECRET:-}"
      QGL_ENV: "${QGL_ENV:-production}"
      QGL_TRACING: "${QGL_TRACING:-}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    ports: ["8000:8000"]
    restart: unless-stopped
    volumes:
      - oms-data:/app/data
    networks:
      default: {}
      shared_web:
        aliases: [qgl-api]
  web:
    build: { context: ., dockerfile: deploy/Dockerfile.web }
    ports: ["5174:80"]
    depends_on: [api]
    restart: unless-stopped
    networks:
      default: {}
      shared_web:
        aliases: [qgl-web]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:latest
    depends_on: [prometheus]
    # No hardcoded default -- GF_SECURITY_ADMIN_PASSWORD must come from .env
    # (Grafana's own default is also "admin", so an unset env var here would
    # silently fall back to an equally weak credential; failing loud is safer).
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "https://grafana.quantgenlabs.com"
      # Anonymous access is VIEWER only: dashboards are readable without a
      # login, but nothing can be edited, created or deleted anonymously.
      # The admin account keeps its password -- this opens reading, not
      # administration, which is the right trade for a public portfolio piece.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      # Hides the "sign in" prompt for anonymous visitors; admin can still
      # reach /login directly.
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    restart: unless-stopped
    networks:
      default: {}
      shared_web:
        aliases: [qgl-grafana]

  # Uncomment with QGL_DATABASE_URL above to run the OMS on PostgreSQL. The
  # crypto desk stays on SQLite either way -- it is self-contained and gains
  # nothing it needs from a server.
  #
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: qgl
  #     POSTGRES_DB: quantgenlabs
  #     # No default. A database password with a fallback is a password everyone
  #     # knows, and compose will refuse to start rather than use one.
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #   # The API must not start against a database that is not accepting
  #   # connections yet -- depends_on alone only waits for the container, not
  #   # for readiness.
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U qgl -d quantgenlabs"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   restart: unless-stopped

volumes:
  oms-data:
  # pg-data:

networks:
  default: {}
  shared_web:
    external: true
