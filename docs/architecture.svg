<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 780" font-family="'IBM Plex Sans',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .panel{fill:#141C2A;stroke:#233144;stroke-width:1}
      .lbl{fill:#E6ECF3;font-size:13px;font-weight:600}
      .sub{fill:#8A99AE;font-size:10.5px}
      .tag{fill:#8A99AE;font-size:10px;font-family:'IBM Plex Mono',monospace}
      .grp{fill:#5B6B82;font-size:10px;letter-spacing:1.3px}
      .badge{fill:#38BFA6;font-size:10px;font-family:'IBM Plex Mono',monospace;font-weight:600}
      .flow{stroke:#38BFA6;stroke-width:1.8;fill:none;marker-end:url(#arr)}
      .flow2{stroke:#5B9BF0;stroke-width:1.4;fill:none;stroke-dasharray:4 3;marker-end:url(#arr2)}
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#38BFA6"/></marker>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5B9BF0"/></marker>
  </defs>

  <rect width="1060" height="780" fill="#0E1420"/>
  <text x="32" y="42" fill="#E6ECF3" font-size="20" font-weight="600">QuantGenLabs — Architecture</text>
  <text x="32" y="62" class="sub">C++20 compute core exposed via pybind11 · thin Python orchestration · numpy as reference/fallback</text>
  <g transform="translate(890,30)"><rect width="138" height="26" rx="6" fill="none" stroke="#E0A44E"/><text x="10" y="17" fill="#E0A44E" font-size="9.5" font-family="'IBM Plex Mono',monospace">SIMULATED · NOT PROD</text></g>

  <!-- CLIENT -->
  <text x="32" y="96" class="grp">CLIENT</text>
  <rect x="32" y="104" width="996" height="58" class="panel" rx="10"/>
  <text x="48" y="128" class="lbl">React Console (Vite)</text>
  <text x="48" y="147" class="sub">Overview · Market Risk · Pricing (European / American LSM) · Crypto desk · Backtesting · Observability · Risk Copilot</text>

  <!-- API + ORCHESTRATION (thin) -->
  <text x="32" y="192" class="grp">THIN ORCHESTRATION  ·  FastAPI + Python glue (no numerics)</text>
  <rect x="32" y="200" width="996" height="58" class="panel" rx="10"/>
  <text x="48" y="224" class="lbl">routers · engines.py impl-selector · desk_context · obs.timed()</text>
  <text x="48" y="243" class="tag">marshals requests, selects impl, records latency — delegates ALL math across the boundary below</text>

  <!-- pybind11 boundary -->
  <line x1="32" y1="288" x2="1028" y2="288" stroke="#38BFA6" stroke-width="1.3" stroke-dasharray="6 4"/>
  <rect x="430" y="276" width="200" height="24" rx="12" fill="#0E1420" stroke="#38BFA6"/>
  <text x="448" y="292" class="badge">pybind11 ABI · GIL released</text>

  <!-- C++ COMPUTE CORE (hero) -->
  <text x="32" y="322" class="grp">C++20 COMPUTE CORE  ·  the engine</text>
  <rect x="32" y="330" width="996" height="300" rx="12" fill="#101B22" stroke="#38BFA6" stroke-width="2"/>

  <!-- module 1 -->
  <rect x="50" y="350" width="470" height="196" rx="9" class="panel"/>
  <text x="66" y="374" class="lbl">quant_engine_cpp</text>
  <text x="66" y="392" class="tag">header-only · -O3 · std::thread</text>
  <text x="66" y="418" class="sub">Black-Scholes-Merton + analytic Greeks</text>
  <text x="66" y="436" class="sub">CRR binomial (European / American)</text>
  <text x="66" y="454" class="sub">Monte Carlo — antithetic · control variate · Sobol QMC</text>
  <text x="66" y="472" class="sub">Parallel MC — deterministic, thread-count-invariant</text>
  <text x="66" y="490" class="sub">Longstaff-Schwartz American MC (regression stopping)</text>
  <text x="66" y="508" class="sub">Scenario / full-revaluation VaR (parallel over shocks)</text>
  <text x="66" y="532" class="badge">splitmix64 per-block seed · in-order FP reduction</text>

  <!-- module 2 -->
  <rect x="536" y="350" width="474" height="196" rx="9" class="panel"/>
  <text x="552" y="374" class="lbl">qgl_xrpl_crypto</text>
  <text x="552" y="392" class="tag">header-only · low-latency tick path</text>
  <text x="552" y="418" class="sub">Perpetual funding · basis · cash-and-carry</text>
  <text x="552" y="436" class="sub">AMM constant-product · exact impermanent loss</text>
  <text x="552" y="454" class="sub">Liquidation / margin · maintenance-margin inversion</text>
  <text x="552" y="472" class="sub">EVT peaks-over-threshold (GPD) tail VaR/ES</text>
  <text x="552" y="490" class="sub">EWMA vol · 24/7 (365d) annualisation</text>
  <text x="552" y="514" class="badge">runs per-tick inside the C++ order-book loop</text>

  <!-- perf strip -->
  <rect x="50" y="558" width="960" height="56" rx="9" fill="#0E1420" stroke="#233144"/>
  <text x="66" y="580" class="lbl" fill="#38BFA6">Performance</text>
  <text x="66" y="600" class="tag" fill="#E6ECF3">~41M MC paths/s/core  ·  ~5× numpy  ·  near-linear strong scaling → ~250M/s @ 8 cores  ·  O(1) memory  ·  bitwise-deterministic across threads</text>

  <!-- numpy fallback (small, side) -->
  <rect x="32" y="648" width="470" height="60" class="panel" rx="10"/>
  <text x="48" y="672" class="lbl">numpy — reference &amp; selective fallback</text>
  <text x="48" y="690" class="sub">golden-file verification; used where already optimal (VaR introselect quantile)</text>

  <!-- observability + copilot -->
  <rect x="518" y="648" width="250" height="60" class="panel" rx="10"/>
  <text x="534" y="672" class="lbl">Observability</text>
  <text x="534" y="690" class="tag">timed() → Prometheus → Grafana p50/p99</text>

  <rect x="784" y="648" width="244" height="60" class="panel" rx="10"/>
  <text x="800" y="672" class="lbl">Claude Risk Copilot</text>
  <text x="800" y="690" class="tag">desk-grounded · SSE · offline fallback</text>

  <!-- flows -->
  <path class="flow" d="M530,162 L530,200"/>
  <path class="flow" d="M530,258 L530,276"/>
  <text x="540" y="274" class="tag" fill="#38BFA6">delegates math</text>
  <path class="flow" d="M267,546 L267,558"/>
  <path class="flow2" d="M643,614 C 643,632 643,632 643,648"/>

  <text x="32" y="742" class="sub">Deploy: docker-compose (api · web · prometheus · grafana) · CI compiles C++ (-Wall -Wextra), runs pytest+Hypothesis &amp; C++ tests, asserts determinism</text>
  <text x="32" y="762" class="tag">green = compute path (into C++)   ·   blue dashed = telemetry / copilot</text>
</svg>
