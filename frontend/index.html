<title>Cryptolabs — Risk &amp; Quant Console</title>
<!-- The theme tokens are defined here as well as in the bundle so the page has a
     background BEFORE any JavaScript runs. Without this the body was styled with
     a literal #0E1420 inline, which beat every stylesheet and left the light
     theme with a dark background. -->
<style>
  :root, [data-theme="dark"] { --qgl-bg:#0E1420; color-scheme: dark; }
  [data-theme="light"] { --qgl-bg:#F4F6F9; color-scheme: light; }
  html, body { margin:0; background: var(--qgl-bg); }
</style>
<script>
  // Resolve the theme before first paint. Doing this in React instead produces a
  // flash of the wrong theme on every load, because the bundle runs after the
  // browser has already painted the body.
  (function () {
    try {
      var saved = localStorage.getItem("qgl-theme");
      var t = (saved === "light" || saved === "dark") ? saved
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", t);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", t === "light" ? "#F4F6F9" : "#0E1420");
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  })();
</script>
</head>
<body><div id="root"></div>
<script type="module" src="/src/main.jsx"></script></body></html>
